# The app's tests on every push and pull request: the screen (vitest, typecheck, bundle) and
# the Rust side (engine relay, updater registration). The installers are built by release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Webview libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      # tauri::generate_context! embeds the built screen, and tauri-build wants the bundled
      # engine to exist: placeholders are enough for the tests (release.yml builds both)
      - run: |
          mkdir -p ../dist binaries && echo '<!doctype html>' > ../dist/index.html
          touch "binaries/modkeel-engine-$(rustc -vV | sed -n 's/^host: //p')"
      - run: cargo test
