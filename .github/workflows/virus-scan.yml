# VirusTotal again on a release's files: every engine is asked to analyse them anew and the
# table at the end of the release notes is replaced, so a false positive a vendor has fixed
# disappears from it (and a new detection appears). Weekly on the latest release, or by hand
# for any tag. release.yml runs the first scan when a release is published.
#
# Secret: VIRUSTOTAL_API_KEY (without it, nothing is scanned).
name: Virus scan

on:
  schedule:
    - cron: "41 6 * * 3"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rescan (empty: the latest release)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: virus-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write       # edit the release notes
    env:
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Key and release
        id: key
        run: |
          if [ -z "$VIRUSTOTAL_API_KEY" ]; then
            echo "::notice::VIRUSTOTAL_API_KEY is not set: nothing scanned."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${TAG:-$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.key.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.key.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Rescan and update the release notes
        if: steps.key.outputs.ready == 'true'
        env:
          RELEASE: ${{ steps.key.outputs.tag }}
        run: |
          pip install requests==2.32.3
          mkdir files
          gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -D files
          python scripts/virustotal.py release "$RELEASE" files --rescan | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: steps.key.outputs.ready == 'true'
        with:
          name: virustotal
          path: files/virustotal.json
