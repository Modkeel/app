[package]
name = "modkeel-app"
version = "0.0.2"
description = "Modkeel desktop app: a window over the Modkeel engine (modkeel serve --stdio)"
edition = "2021"
publish = false

[lib]
name = "modkeel_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Updates from Modkeel/app releases (src/updater.ts); registered only in builds that carry
# the updater's public key (tauri.conf.json plugins.updater), see lib.rs
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The taskbar icon (lib.rs set_taskbar_icon): Tauri only sets the title bar's.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
